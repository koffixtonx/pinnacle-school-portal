<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylised library reading room">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03121f"/>
      <stop offset=".6" stop-color="#123454"/>
      <stop offset="1" stop-color="#1f4c74"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd0f5"/>
      <stop offset=".55" stop-color="#f6dc9b"/>
      <stop offset="1" stop-color="#ffe9ad"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9ad"/>
      <stop offset=".45" stop-color="#f7cf72" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f7cf72" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9ad" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ffe9ad" stop-opacity="0"/>
    </linearGradient>
    <pattern id="spines" width="36" height="150" patternUnits="userSpaceOnUse">
      <rect width="10" height="150" x="2" fill="#ffd77a" opacity=".8"/>
      <rect width="8" height="150" x="14" fill="#7fc4ef" opacity=".75"/>
      <rect width="11" height="150" x="24" fill="#c98f5a" opacity=".7"/>
    </pattern>
    <pattern id="spinesAlt" width="32" height="150" patternUnits="userSpaceOnUse">
      <rect width="9" height="150" x="2" fill="#7fc4ef" opacity=".7"/>
      <rect width="7" height="150" x="13" fill="#e0a76b" opacity=".8"/>
      <rect width="10" height="150" x="22" fill="#ffe9ad" opacity=".65"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#room)"/>

  <!-- arched window -->
  <g>
    <path d="M1180 470V190a180 180 0 0 1 360 0v280z" fill="url(#window)"/>
    <g fill="#02101f">
      <path d="M1170 480V188a190 190 0 0 1 380 0v292h-20V188a170 170 0 0 0-340 0v292z"/>
      <rect x="1355" y="130" width="18" height="350"/>
      <rect x="1180" y="290" width="360" height="16"/>
      <rect x="1180" y="404" width="360" height="16"/>
    </g>
    <polygon points="1200,470 1520,470 1600,720 1100,720" fill="url(#spill)"/>
  </g>

  <!-- shelf cases -->
  <g>
    <rect x="60" y="70" width="470" height="590" rx="8" fill="#02101f"/>
    <rect x="570" y="70" width="470" height="590" rx="8" fill="#02101f"/>
    <rect x="90" y="110" width="410" height="150" fill="url(#spines)"/>
    <rect x="90" y="320" width="410" height="150" fill="url(#spinesAlt)"/>
    <rect x="90" y="530" width="410" height="110" fill="url(#spines)"/>
    <rect x="600" y="110" width="410" height="150" fill="url(#spinesAlt)"/>
    <rect x="600" y="320" width="410" height="150" fill="url(#spines)"/>
    <rect x="600" y="530" width="410" height="110" fill="url(#spinesAlt)"/>
  </g>

  <g fill="#0b2743">
    <rect x="60" y="262" width="470" height="18"/>
    <rect x="60" y="472" width="470" height="18"/>
    <rect x="570" y="262" width="470" height="18"/>
    <rect x="570" y="472" width="470" height="18"/>
  </g>
  <g fill="#a8d3f2" opacity=".35">
    <rect x="60" y="262" width="470" height="4"/>
    <rect x="60" y="472" width="470" height="4"/>
    <rect x="570" y="262" width="470" height="4"/>
    <rect x="570" y="472" width="470" height="4"/>
  </g>

  <!-- pendant lamps -->
  <g>
    <rect x="418" y="60" width="6" height="140" fill="#02101f"/>
    <rect x="1178" y="60" width="6" height="110" fill="#02101f"/>
    <circle cx="421" cy="215" r="170" fill="url(#lamp)"/>
    <circle cx="1181" cy="185" r="150" fill="url(#lamp)"/>
    <path d="M391 200h60l-14 34h-32z" fill="#ffe9ad"/>
    <path d="M1151 172h60l-14 34h-32z" fill="#ffe9ad"/>
  </g>

  <!-- floor and reading table -->
  <rect y="660" width="1600" height="240" fill="#06203a"/>
  <rect y="654" width="1600" height="10" fill="#a8d3f2" opacity=".35"/>

  <g fill="#010d19">
    <rect x="150" y="700" width="1300" height="30" rx="10"/>
    <rect x="230" y="730" width="30" height="170"/>
    <rect x="1340" y="730" width="30" height="170"/>
  </g>
  <rect x="150" y="700" width="1300" height="6" fill="#ffe9ad" opacity=".45"/>

  <g>
    <rect x="420" y="676" width="120" height="24" rx="4" fill="#c98f5a"/>
    <rect x="980" y="676" width="140" height="24" rx="4" fill="#7fc4ef"/>
    <rect x="420" y="668" width="120" height="10" rx="4" fill="#e0a76b"/>
  </g>
</svg>
